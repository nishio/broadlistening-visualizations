[project]
name = "broadlistening-visualizations"
version = "0.1.0"
description = "広聴AI の公開用 artifact (public_result.json) を入力にした可視化の試作とカタログ"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false

[dependency-groups]
# 対立軸ビュー（scripts/build_divcon.py）で LLM を呼ぶときだけ使う
llm = ["openai>=1.99", "pydantic>=2.7"]
# 賛否スライダー（scripts/build_stance_slider.py）の UMAP
umap = ["umap-learn>=0.5.7"]
