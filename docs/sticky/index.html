<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>付箋ズーム</title>
<style>
:root {
  --bg: #f6f5f1; --fg: #1d1d1b; --muted: #6b6a64; --line: #d8d6ce; --accent: #2f4f7f; --panel: rgba(246,245,241,.94);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #17181a; --fg: #ecebe6; --muted: #a09f98; --line: #34363a; --accent: #8fb0e0; --panel: rgba(23,24,26,.94); }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
.top { position: fixed; left: 0; right: 0; top: 0; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; margin: 0; display: inline; }
h1 a { color: inherit; text-decoration: none; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.ctl { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
button { font: inherit; font-size: 13px; min-width: 36px; padding: 6px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; cursor: pointer; }
.detail { position: fixed; left: 16px; bottom: 16px; max-width: min(460px, calc(100% - 90px)); padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: none; }
.detail.on { display: block; }
.detail .path { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
.detail a { color: var(--accent); font-size: 12px; }
.lvl { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <h1><a href="../">←</a> <span id="title">付箋ズーム</span></h1> <span class="lvl" id="lvl"></span>
  <div class="sub" id="sub">読み込み中…</div>
</div>
<div class="ctl">
  <button id="zin" aria-label="zoom in">＋</button>
  <button id="zout" aria-label="zoom out">－</button>
  <button id="fit" aria-label="fit">⤢</button>
  <button id="lang">EN</button>
</div>
<div class="detail" id="detail"></div>
<script>
"use strict";
// 付箋の位置と「どの拡大率から付箋として出すか」は scripts/build_sticky_layout.py で事前に決めてある。
// ここでは拡大率と比べて、出す付箋は付箋、まだ出さない意見は点で描くだけ。付箋は画面上で一定の大きさ。
// 一度出た付箋は寄っても消えず、位置も動かない。
const I18N = {
  ja: { title: "付箋ズーム", src: "元の提案（PR）を開く", shown: (n, t) => `· 付箋 ${n.toLocaleString()} 枚 / ${t.toLocaleString()} 件`,
        sub: (n) => `意見 ${n.toLocaleString()} 件を広聴AI の配置に置いた。引いた状態では各まとまりの代表の意見が付箋で、寄るほど付箋が増え、最後は全部の意見が付箋になる。ホイール・ピンチで拡大、ドラッグで移動、付箋を押すと詳細。` },
  en: { title: "Sticky-note zoom", src: "Open the source proposal (PR)", shown: (n, t) => `· ${n.toLocaleString()} notes / ${t.toLocaleString()} opinions`,
        sub: (n) => `${n.toLocaleString()} opinions on the Kouchou-AI layout. Zoomed out, each group shows its representative opinion as a note; zoom in and more notes appear until every opinion is a note. Wheel or pinch to zoom, drag to pan, tap a note for details.` },
};
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
let P, L, lang = "ja", W, H, dpr = 1;
let tx = 0, ty = 0, k = 1, fitK = 1, maxK = 1;
let A = [], C = new Map(), placed = [], NW = 140, NH = 76;
const STEP = Math.pow(2, 1 / 8);
const cache = new Map();

const sx = (x) => x * k + tx, sy = (y) => -y * k + ty;
const wx = (X) => (X - tx) / k, wy = (Y) => -(Y - ty) / k;

function resize() { dpr = window.devicePixelRatio || 1; W = window.innerWidth; H = window.innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); requestDraw(); }
function fit() {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const a of A) { x0 = Math.min(x0, a.x); x1 = Math.max(x1, a.x); y0 = Math.min(y0, a.y); y1 = Math.max(y1, a.y); }
  const top = 70;
  k = fitK = Math.min(W / (x1 - x0), (H - top) / (y1 - y0)) * 0.92;
  tx = W / 2 - (x0 + x1) / 2 * k; ty = top + (H - top) / 2 + (y0 + y1) / 2 * k; requestDraw();
}
function zoomAt(X, Y, f) {
  const nk = Math.max(fitK * 0.6, Math.min(maxK, k * f));
  const a = wx(X), b = wy(Y); k = nk; tx = X - a * k; ty = Y + b * k; requestDraw();
}

const txt = (a) => (lang === "en" && a.ten) || a.text;
const lab = (c) => (lang === "en" && c.len) || c.label;
function wrap(s, maxW, maxLines) {
  const out = []; let line = "";
  for (const ch of s) {
    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; if (out.length === maxLines) { line = null; break; } }
    else line += ch;
  }
  if (line) out.push(line);
  else if (line === null) { let l = out[maxLines - 1]; while (l && ctx.measureText(l + "…").width > maxW) l = l.slice(0, -1); out[maxLines - 1] = l + "…"; }
  return out;
}
// 付箋の中身は大きさが一定なので、改行位置は言語ごとに 1 回だけ計算して使い回す
function content(a) {
  const key = lang + a.i;
  let c = cache.get(key);
  if (c) return c;
  const pad = 7, w = NW - pad * 2;
  c = {};
  if (a.head) {
    ctx.font = `600 11px ${FONT}`; c.head = wrap(lab(a.head === 1 ? a.c1 : a.c2), w, 2);
    ctx.font = `400 11px ${FONT}`; c.body = wrap(txt(a), w, c.head.length === 1 ? 3 : 2);
  } else {
    ctx.font = `400 12px ${FONT}`; c.body = wrap(txt(a), w, 4);
  }
  cache.set(key, c);
  return c;
}

function drawNote(a, X, Y, alpha) {
  const x = X - NW / 2, y = Y - NH / 2, pad = 7;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "rgba(0,0,0,.13)"; ctx.fillRect(x + 2, y + 2, NW, NH);
  ctx.fillStyle = a.c1.color; ctx.fillRect(x, y, NW, NH);
  const c = content(a);
  ctx.textBaseline = "top";
  if (c.head) {
    const bh = c.head.length * 14 + 6;
    ctx.fillStyle = a.c1.band; ctx.fillRect(x, y, NW, bh);
    ctx.fillStyle = "#14140f"; ctx.font = `600 11px ${FONT}`;
    c.head.forEach((l, i) => ctx.fillText(l, x + pad, y + 4 + i * 14));
    ctx.font = `400 11px ${FONT}`; ctx.fillStyle = "#2a2a26";
    c.body.forEach((l, i) => ctx.fillText(l, x + pad, y + bh + 4 + i * 14));
  } else {
    ctx.font = `400 12px ${FONT}`; ctx.fillStyle = "#1d1d1b";
    const lh = 15.5, y0 = y + (NH - c.body.length * lh) / 2 + 1;
    c.body.forEach((l, i) => ctx.fillText(l, x + pad, y0 + i * lh));
  }
  ctx.globalAlpha = 1;
  placed.push({ a, x, y });
}

let pending = false;
function requestDraw() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; draw(); }); } }
function draw() {
  if (!A.length) return;
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor; ctx.fillRect(0, 0, W, H);
  placed = [];
  const notes = [];
  let shown = 0;
  for (const a of A) {
    if (a.z <= k) shown++;
    const X = sx(a.x), Y = sy(a.y);
    if (X < -NW || X > W + NW || Y < -NH || Y > H + NH) continue;
    if (a.z <= k) notes.push([a, X, Y]);
    else { ctx.fillStyle = a.c1.dot; ctx.fillRect(X - 1.2, Y - 1.2, 2.4, 2.4); }
  }
  // 出始めの付箋は 1.5 段ぶんかけて濃くする（段の境目で急に現れないように）
  for (const [a, X, Y] of notes) drawNote(a, X, Y, Math.min(1, 0.25 + Math.log(k / a.z) / Math.log(STEP) / 1.5));
  $("lvl").textContent = I18N[lang].shown(shown, A.length);
}

function showDetail(a) {
  const d = $("detail"); d.innerHTML = "";
  const path = document.createElement("div"); path.className = "path"; path.textContent = lab(a.c1) + " › " + lab(a.c2); d.appendChild(path);
  const t = document.createElement("div"); t.textContent = txt(a); d.appendChild(t);
  if (lang === "en" && a.ten) { const j = document.createElement("div"); j.className = "path"; j.textContent = a.text; d.appendChild(j); }
  if (a.url) { const l = document.createElement("a"); l.href = a.url; l.target = "_blank"; l.rel = "noopener"; l.textContent = I18N[lang].src; d.appendChild(l); }
  d.classList.add("on");
}

const ptrs = new Map(); let moved = 0, pinch0 = null;
cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; cv.classList.add("drag"); });
cv.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { tx += e.clientX - prev.x; ty += e.clientY - prev.y; moved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y); requestDraw(); }
  else if (ptrs.size === 2) {
    const [p, q] = [...ptrs.values()]; const dist = Math.hypot(p.x - q.x, p.y - q.y);
    if (pinch0) zoomAt((p.x + q.x) / 2, (p.y + q.y) / 2, dist / pinch0);
    pinch0 = dist; moved = 99;
  }
});
const up = (e) => {
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; cv.classList.remove("drag");
  if (e.type === "pointerup" && moved < 6 && ptrs.size === 0) {
    const hit = placed.find((p) => e.clientX >= p.x && e.clientX <= p.x + NW && e.clientY >= p.y && e.clientY <= p.y + NH);
    if (hit) showDetail(hit.a); else $("detail").classList.remove("on");
  }
};
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
$("zin").addEventListener("click", () => zoomAt(W / 2, H / 2, 1.6));
$("zout").addEventListener("click", () => zoomAt(W / 2, H / 2, 1 / 1.6));
$("fit").addEventListener("click", fit);
$("lang").addEventListener("click", () => { lang = lang === "ja" ? "en" : "ja"; applyLang(); });
window.addEventListener("resize", resize);

function applyLang() {
  document.documentElement.lang = lang;
  $("title").textContent = I18N[lang].title; document.title = I18N[lang].title;
  $("sub").textContent = I18N[lang].sub(A.length);
  $("lang").textContent = lang === "ja" ? "EN" : "日本語";
  $("detail").classList.remove("on"); requestDraw();
}

async function main() {
  const q = new URLSearchParams(location.search);
  const [p, l] = await Promise.all([
    fetch(q.get("data") || "../data/team-mirai-2025/public_result.json").then((r) => r.json()),
    fetch(q.get("layout") || "team-mirai-2025.layout.json").then((r) => r.json()),
  ]);
  P = p; L = l;
  NW = L.meta.note.w; NH = L.meta.note.h; maxK = L.meta.z_full * 2;
  const en = (P.translations && P.translations.en) || {}, enC = en.clusters || {}, enA = en.arguments || {};
  const maxLevel = Math.max(...P.clusters.map((c) => c.level));
  const l1 = P.clusters.filter((c) => c.level === 1).sort((a, b) => b.value - a.value);
  l1.forEach((c, i) => {
    const hue = Math.round((i * 137.5) % 360);
    C.set(c.id, { ...c, len: enC[c.id] && enC[c.id].label, color: `hsl(${hue} 70% 85%)`, band: `hsl(${hue} 55% 70%)`, dot: `hsla(${hue} 55% 50% / .55)` });
  });
  for (const c of P.clusters) if (!C.has(c.id)) C.set(c.id, { ...c, len: enC[c.id] && enC[c.id].label });
  A = P.arguments.map((a, i) => ({
    i, x: L.x[i], y: L.y[i], z: L.z[i], rank: L.rank[i], head: L.head[i],
    c1: C.get(a.cluster_ids[1]), c2: C.get(a.cluster_ids[maxLevel]), text: a.argument, ten: enA[a.arg_id], url: a.url,
  }));
  A.sort((p, q) => p.rank - q.rank);
  if (!Object.keys(enC).length) $("lang").style.display = "none";
  resize(); fit(); applyLang();
}
main().catch((e) => { $("sub").textContent = "読み込みに失敗しました: " + e; });
</script>
</body>
</html>
