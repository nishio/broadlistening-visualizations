<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一緒に言われた話題</title>
<style>
/* 色の役割：灰＝背景の意見と近い組の線、橙＝地図の上で離れた組の線、青と緑みの青＝選んだ組の左の欄と右の欄。
   20 ある上位クラスタは色分けしない（20 色は見分けられない）。代わりに地図の上に名前を出す */
:root {
  --bg: #f6f5f1; --fg: #1d1d1b; --muted: #6b6a64; --line: #d8d6ce; --accent: #2f4f7f;
  --panel: #fbfaf7; --hover: #ecebe4; --card: #ffffff;
  --dot: rgba(107, 106, 100, .30); --dot-dim: rgba(107, 106, 100, .14);
  --near: rgba(82, 81, 78, .62); --far: #eb6834; --side-a: #2a78d6; --side-b: #1baf7a;
  --halo: rgba(246, 245, 241, .92);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --fg: #ecebe6; --muted: #a09f98; --line: #34363a; --accent: #8fb0e0;
    --panel: #1b1c1f; --hover: #26282c; --card: #222327;
    --dot: rgba(160, 159, 152, .28); --dot-dim: rgba(160, 159, 152, .11);
    --near: rgba(195, 194, 183, .55); --far: #d95926; --side-a: #3987e5; --side-b: #199e70;
    --halo: rgba(23, 24, 26, .9);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* 読み込みが終わるまで（と失敗したとき）は操作のボタンを出さない */
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
       display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
header { flex: none; padding: 10px 16px 8px; border-bottom: 1px solid var(--line); }
.hrow { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
h1 { font-size: 17px; margin: 0; }
h1 a { color: inherit; text-decoration: none; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
button { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button:first-child { border-radius: 6px 0 0 6px; }
.seg button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
.wrap { flex: 1; min-height: 0; display: flex; }
.mapbox { position: relative; flex: 1; min-width: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
canvas.over { cursor: pointer; }
.ctl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.ctl button { min-width: 36px; padding: 6px 10px; font-size: 13px; background: var(--panel); }
.tip { position: absolute; z-index: 2; pointer-events: none; max-width: 280px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px;
       background: var(--panel); font-size: 12px; line-height: 1.4; display: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
.tip b { display: block; font-size: 13px; }
.panel { flex: none; width: 440px; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 12px 16px 0; }
.panel h2 { font-size: 15px; margin: 2px 0 6px; line-height: 1.4; }
.note { color: var(--muted); font-size: 12px; margin: 4px 0; }
.legend { list-style: none; margin: 8px 0; padding: 0; font-size: 12px; color: var(--muted); }
.legend li { display: flex; gap: 8px; align-items: center; margin: 3px 0; }
.sw { flex: none; display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--near); border-radius: 2px; }
.sw.far { border-top-color: var(--far); }
.dot { flex: none; display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; }
.dot.a { background: var(--side-a); } .dot.b { background: var(--side-b); }
.legend li.w { flex-wrap: wrap; column-gap: 12px; }
.widths { display: inline-flex; gap: 12px; align-items: center; white-space: nowrap; }
.widths > span { display: inline-flex; gap: 5px; align-items: center; }
.sortbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
.rows { list-style: none; margin: 0 -8px; padding: 0; }
.rows li { border-bottom: 1px solid var(--line); }
.rows button { display: flex; gap: 10px; width: 100%; text-align: left; border: none; border-radius: 0; background: none; padding: 7px 8px; font-size: 13px; line-height: 1.45; }
.rows button:hover, .rows button.hl { background: var(--hover); }
.rows .sw { margin-top: 9px; }
.rows .dot { margin-top: 5px; }
.rows .t { flex: 1; min-width: 0; }
.rows .x { color: var(--muted); padding: 0 3px; }
.num { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.back { margin: 2px 0 8px; }
.path { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
.stats { font-size: 13px; margin: 6px 0 10px; }
.colhead { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px; font-weight: 600; position: sticky; top: -12px; background: var(--panel); padding: 6px 0; border-bottom: 1px solid var(--line); z-index: 1; }
.colhead div { display: flex; gap: 6px; align-items: flex-start; min-width: 0; }
.colhead .dot { margin-top: 3px; }
.evg { margin: 10px 0 12px; }
.evh { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
.evh a { color: var(--accent); }
.ev { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ev > div { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--side-a); border-radius: 4px; padding: 4px 8px; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.ev > div.b { border-left-color: var(--side-b); }
.ev p { margin: 2px 0; }
.ev p + p { border-top: 1px dashed var(--line); padding-top: 3px; }
.ev .ja { color: var(--muted); font-size: 11px; }
.take { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
footer { color: var(--muted); font-size: 11px; padding: 16px 0 16px; border-top: 1px solid var(--line); margin-top: 16px; }
footer a { color: var(--accent); }
.err { color: var(--fg); font-weight: 600; }
@media (max-width: 760px) {
  header { padding: 8px 16px 6px; }
  h1 { font-size: 16px; }
  .sub:not(.err):not(.loading) { display: none; } /* 説明は地図のすぐ下の欄にもある。地図を広く取る */
  .bar { margin-top: 4px; gap: 5px; }
  .bar button { font-size: 11.5px; padding: 4px 8px; }
  .wrap { flex-direction: column; }
  .mapbox { flex: 1 1 0; }
  .panel { flex: 1.15 1 0; width: auto; border-left: none; border-top: 1px solid var(--line); }
  .ctl { right: 8px; bottom: 8px; flex-direction: row; }
}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1><a href="../">←</a> <span id="title">一緒に言われた話題</span></h1><button id="lang" hidden>EN</button></div>
  <div class="sub loading" id="sub">読み込み中…</div>
  <div class="bar" id="bar" hidden>
    <span class="seg" role="group" id="tiers"><button id="tier1" aria-pressed="true"></button><button id="tier2" aria-pressed="false"></button></span>
    <button id="far" aria-pressed="false"></button>
  </div>
</header>
<div class="wrap">
  <div class="mapbox" id="mapbox">
    <canvas id="cv" role="img"></canvas>
    <div class="ctl" id="ctl" hidden>
      <button id="zin" aria-label="zoom in">＋</button>
      <button id="zout" aria-label="zoom out">－</button>
      <button id="fit" aria-label="fit">⤢</button>
    </div>
    <div class="tip" id="tip"></div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>
<script>
"use strict";
// 組の選び方（偶然の見込み・有意の基準・地図上の距離）と根拠の投稿は scripts/build_links_cooccurrence.py で事前に決めてある。
// ここでは public_result.json（意見の文・位置・英訳）と、その組の JSON を読んで描くだけ。
const I18N = {
  ja: {
    title: "一緒に言われた話題",
    canvas: "広聴AI の散布図の上に、同じ投稿で一緒に書かれた話題の組を線で結んだ地図。同じ組は一覧から選べる。",
    sub: "同じ投稿の中で一緒に書かれた話題（下位クラスタ）を、偶然では説明できない組だけ線で結ぶ。線を押すと、両方を書いた投稿の意見が出る。",
    tier1: (n) => `厳しい基準 ${n} 組`, tier2: (n) => `緩い基準 ${n} 組`, far: (n) => `離れた組だけ（${n}）`,
    head: (n, f) => `つながり ${n} 組（うち地図の上で離れた組 ${f}）`,
    expl: (M) => [
      `地図は広聴AI の散布図（文の似かたで置いた配置）。点は意見 ${M.n_arguments.toLocaleString()} 件、小さな丸は下位クラスタ ${M.n_clusters} の重心。`,
      `線は、同じ投稿（${M.group_by} が同じ意見をまとめた ${M.n_groups.toLocaleString()} 本）の中で一緒に書かれた下位クラスタの組。偶然の見込みよりずっと多い組だけを引く。`,
      M.null === "simple" ? "見込みは「x を含む投稿の数 × y を含む投稿の数 ÷ 投稿の数」。"
        : "見込みは、含む話題（下位クラスタ）の数が同じ投稿どうしで、x と y が独立に入るとして出し、足し合わせたもの。話題が 1 つだけの投稿は組を作れず、話題の多い長い投稿ほど組を作りやすいため。",
      `厳しい基準：全 ${M.n_tests.toLocaleString()} 組で Bonferroni ${pctTxt(M.alpha)}。緩い基準：偽発見率 ${pctTxt(M.fdr)}（Benjamini–Hochberg）。`,
    ],
    legFar: (M) => `地図の上で離れた組（重心どうしが地図の対角線の ${pctTxt(M.far)} 以上）。散布図では離れて見えるのに、同じ投稿で一緒に書かれる`,
    legNear: "近い組（多くは同じ話題を割った隣どうし）",
    legW: "太さ＝一緒に書かれた投稿の数",
    posts: (n) => `${n} 本`, sortBy: "並べ方：", sortD: "地図上の距離", sortK: "投稿の数", sortL: "偶然の何倍か",
    rowNum: (p) => `${p.k} 本 · 偶然の ${liftTxt(p.lift)} 倍 · 距離 ${pctTxt(p.d)}${p.cross ? " · 上位クラスタをまたぐ" : ""}`,
    none: "この条件に当たる組はない。", back: "← 一覧へ",
    tops: (a, b) => a === b ? `どちらも上位クラスタ「${a}」` : `上位クラスタ：「${a}」と「${b}」`,
    stat: (p, M) => `${p.k} 本の投稿で一緒に書かれた。偶然なら ${numTxt(p.lam)} 本で、その ${liftTxt(p.lift)} 倍（p = ${pTxt(p.p)}、${p.tier === 1 ? "厳しい基準でも残る" : "緩い基準でだけ残る"}）。地図の上の距離は対角線の ${pctTxt(p.d)}。`,
    sim: (p, M) => `埋め込みで見た文の近さは、全 ${M.n_tests.toLocaleString()} 組を近い順に並べて上から ${pctTxt(p.sim_top)} の所。`,
    evHead: "両方を書いた投稿（左右がそれぞれの側の意見）", src: "出典",
    cl: (c, n, M) => `意見 ${c.size.toLocaleString()} 件・投稿 ${c.n.toLocaleString()} 本。偶然では説明できない相手 ${n} 組。`,
    hidden: (n) => `「離れた組だけ」にしているので、近い相手 ${n} 組は隠れている。`,
    tipC: (n) => `相手 ${n} 組`, top: "上位クラスタ",
    mismatch: "組の JSON（?links=）が、この public_result.json（?data=）から作ったものではない。scripts/build_links_cooccurrence.py で作って ?links= に渡す。",
    fail: "読み込みに失敗しました: ",
    foot: "出典：チームみらい・しゃべれるマニフェスト参加者 / データセット ", code: "ソースコード", built: (M) => `${M.group_by} で束ねた · 作成 ${M.built}`,
  },
  en: {
    title: "Topics written together",
    canvas: "Kouchou-AI's scatter plot with lines joining topics written together in the same posts. The same pairs can be chosen from the list.",
    sub: "Lines join pairs of topics (lower clusters) that the same post mentions together more often than chance explains. Tap a line to see those posts.",
    tier1: (n) => `Strict (${n})`, tier2: (n) => `Loose (${n})`, far: (n) => `Far apart only (${n})`,
    head: (n, f) => `${n} links (${f} of them far apart on the map)`,
    expl: (M) => [
      `The map is Kouchou-AI's scatter plot (opinions placed by how similar their sentences are). Dots are ${M.n_arguments.toLocaleString()} opinions; small circles are the centres of ${M.n_clusters} lower clusters.`,
      `A line joins two lower clusters written together in the same post (opinions sharing ${M.group_by}: ${M.n_groups.toLocaleString()} posts), only where that happens far more often than chance.`,
      M.null === "simple" ? "Chance is “posts containing x × posts containing y ÷ all posts”."
        : "Chance is computed among posts with the same number of topics (lower clusters), treating x and y as independent, and summed: a single-topic post cannot form a pair, and long posts with many topics form pairs more easily.",
      `Strict: Bonferroni ${pctTxt(M.alpha)} over all ${M.n_tests.toLocaleString()} pairs. Loose: false discovery rate ${pctTxt(M.fdr)} (Benjamini–Hochberg).`,
    ],
    legFar: (M) => `Far apart on the map (centres at least ${pctTxt(M.far)} of the map diagonal apart): they look distant in the scatter plot, yet the same posts mention both`,
    legNear: "Nearby pairs (mostly neighbouring splits of one topic)",
    legW: "Width = number of posts mentioning both",
    posts: (n) => `${n}`, sortBy: "Sort by:", sortD: "map distance", sortK: "posts", sortL: "times chance",
    rowNum: (p) => `${p.k} posts · ${liftTxt(p.lift)}× chance · distance ${pctTxt(p.d)}${p.cross ? " · across top clusters" : ""}`,
    none: "No pairs match.", back: "← List",
    tops: (a, b) => a === b ? `Both in the top cluster “${a}”` : `Top clusters: “${a}” and “${b}”`,
    stat: (p, M) => `Written together in ${p.k} posts, against ${numTxt(p.lam)} expected by chance: ${liftTxt(p.lift)} times (p = ${pTxt(p.p)}; ${p.tier === 1 ? "passes the strict threshold" : "passes the loose threshold only"}). Their centres are ${pctTxt(p.d)} of the map diagonal apart.`,
    sim: (p, M) => ` By embedding similarity, it ranks in the top ${pctTxt(p.sim_top)} of all ${M.n_tests.toLocaleString()} pairs, closest first.`,
    evHead: "Posts that mention both (left and right are the two sides)", src: "source",
    cl: (c, n, M) => `${c.size.toLocaleString()} opinions in ${c.n.toLocaleString()} posts. ${n} partner(s) beyond chance.`,
    hidden: (n) => `“Far apart only” is on, so ${n} nearby partner(s) are hidden.`,
    tipC: (n) => `${n} partner(s)`, top: "Top cluster",
    mismatch: "The pair file (?links=) was not built from this public_result.json (?data=). Build it with scripts/build_links_cooccurrence.py and pass it as ?links=.",
    fail: "Failed to load: ",
    foot: "Source: Team Mirai and the participants of Shabereru Manifesto / dataset ", code: "source code", built: (M) => `grouped by ${M.group_by} · built ${M.built}`,
  },
};
const FONT = 'system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif';
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const pctTxt = (v) => { const x = v * 100; return (x >= 10 ? Math.round(x) : x >= 1 ? x.toFixed(1).replace(/\.0$/, "") : x.toFixed(2).replace(/0$/, "")) + "%"; };
const liftTxt = (v) => v >= 10 ? Math.round(v).toString() : v.toFixed(1);
const numTxt = (v) => v >= 10 ? v.toFixed(0) : v >= 1 ? v.toFixed(1) : v.toFixed(2);
const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
const pTxt = (p) => { if (p >= 0.001) return p.toPrecision(2); const e = Math.floor(Math.log10(p)); return `${(p / 10 ** e).toFixed(1)}×10${String(e).replace(/./g, (c) => SUP[c])}`; };

let P = null, M = null, ready = false, lang = "ja", tier = 1, farOnly = false, sortKey = "d", sel = null, hover = null;
let NP = 0, PX = null, PY = null, bounds = null;
const CL = new Map();      // 下位クラスタ id -> { id, x, y, n（含む投稿の数）, size（意見の数）, top, idx: 意見の添字 }
const TOPS = [];           // 上位クラスタ（地図に名前を出す。大きい順）
const ARG = new Map();     // arg_id -> 意見の添字
const CLINFO = new Map();  // public_result.json のクラスタ（表札・説明）
let PAIRS = [], vis = [], linked = new Set();
const en = () => (P.translations && P.translations.en) || {};
const cLabel = (id) => { const e = en().clusters; return (lang === "en" && e && e[id] && e[id].label) || (CLINFO.get(id) || {}).label || id; };
const cTake = (id) => { const e = en().clusters; return (lang === "en" && e && e[id] && e[id].takeaway) || (CLINFO.get(id) || {}).takeaway || ""; };
const aText = (i) => { const a = P.arguments[i], e = en().arguments; return (lang === "en" && e && e[a.arg_id]) || a.argument; };

// ---- 表示する組 ----
function refresh() {
  vis = PAIRS.filter((p) => p.tier <= tier && (!farOnly || p.far));
  linked = new Set();
  for (const p of vis) { linked.add(p.A); linked.add(p.B); }
  if (hover && !vis.includes(hover)) hover = null;
  if (sel && sel.kind === "pair" && !vis.includes(sel.p)) { sel = null; setHash(); }
}
// 選んでいるものを URL の #p= / #c= に残す
function setHash() {
  const h = !sel ? "" : sel.kind === "pair" ? `#p=${sel.p.A.id},${sel.p.B.id}` : `#c=${sel.c.id}`;
  history.replaceState(null, "", location.pathname + location.search + h);
}
const lw = (k) => Math.max(1.2, 1.25 * Math.sqrt(k) - 0.8);

// ---- 地図の座標 ----
let W = 0, H = 0, dpr = 1, k = 1, tx = 0, ty = 0, fitK = 1, atFit = true;
const sx = (x) => x * k + tx, sy = (y) => -y * k + ty;
const fitPad = () => Math.min(28, W * 0.04);
const scaleFor = (x0, x1, y0, y1, pad) => Math.min((W - 2 * pad) / Math.max(1e-9, x1 - x0), (H - 2 * pad) / Math.max(1e-9, y1 - y0));
function fitTo(x0, x1, y0, y1, pad, maxK) {
  k = Math.min(scaleFor(x0, x1, y0, y1, pad), maxK || Infinity);
  tx = W / 2 - (x0 + x1) / 2 * k; ty = H / 2 + (y0 + y1) / 2 * k;
}
function fit() { fitTo(bounds.x0, bounds.x1, bounds.y0, bounds.y1, fitPad()); fitK = k; atFit = true; requestDraw(); }
function zoomAt(X, Y, f) {
  const nk = Math.max(fitK * 0.5, Math.min(fitK * 60, k * f));
  const wx = (X - tx) / k, wy = -(Y - ty) / k; k = nk; tx = X - wx * k; ty = Y + wy * k; atFit = false; requestDraw();
}
// 大きさが変わったら、全体表示のままなら全体に合わせ直し、寄っていたら画面の中心の位置を保つ
function resize() {
  const r = $("mapbox").getBoundingClientRect();
  const ow = W, oh = H, cx = (ow / 2 - tx) / k, cy = -(oh / 2 - ty) / k;
  W = r.width; H = r.height; dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!bounds || !W || !H) return;
  if (atFit || !ow) { fit(); return; }
  fitK = scaleFor(bounds.x0, bounds.x1, bounds.y0, bounds.y1, fitPad());
  tx = W / 2 - cx * k; ty = H / 2 + cy * k; requestDraw();
}
// 選んだ組の両端が画面の外なら、両端が入るまで引く
function ensureVisible(ids) {
  const cs = ids.map((id) => CL.get(id));
  const m = 40;
  if (cs.every((c) => sx(c.x) > m && sx(c.x) < W - m && sy(c.y) > m && sy(c.y) < H - m)) return;
  const xs = cs.map((c) => c.x), ys = cs.map((c) => c.y);
  fitTo(Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys), Math.min(90, W * 0.2), k);
  atFit = false;
}

// ---- 色（CSS の変数から読む。ダークモードの切り替えでも読み直す）----
let C = {};
function readColors() {
  const s = getComputedStyle(document.documentElement);

$("tier2").addEventListener("click", () => setTier(2));
$("far").addEventListener("click", () => { farOnly = !farOnly; refresh(); updateButtons(); renderPanel(); requestDraw(); });
$("lang").addEventListener("click", () => { lang = lang === "ja" ? "en" : "ja"; applyLang(); });

async function main() {
  const q = new URLSearchParams(location.search);
  const [p, l] = await Promise.all([
    fetch(q.get("data") || "../data/team-mirai-2025/public_result.json").then((r) => { if (!r.ok) throw new Error(r.status + " " + r.url); return r.json(); }),
    fetch(q.get("links") || "team-mirai-2025.json").then((r) => { if (!r.ok) throw new Error(r.status + " " + r.url); return r.json(); }),
  ]);
  P = p; M = l.meta;
  $("sub").classList.remove("loading");
  P.arguments.forEach((a, i) => ARG.set(a.arg_id, i));
  for (const c of P.clusters) CLINFO.set(c.id, c);
  const miss = l.pairs.some((q) => q.ev.some((e) => e[1].concat(e[2]).some((id) => !ARG.has(id))));
  if (M.n_arguments !== P.arguments.length || miss) throw new Error(I18N[lang].mismatch);
  NP = P.arguments.length; PX = new Float32Array(NP); PY = new Float32Array(NP);
  bounds = { x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity };
  P.arguments.forEach((a, i) => {
    PX[i] = a.x; PY[i] = a.y;
    bounds.x0 = Math.min(bounds.x0, a.x); bounds.x1 = Math.max(bounds.x1, a.x); bounds.y0 = Math.min(bounds.y0, a.y); bounds.y1 = Math.max(bounds.y1, a.y);
  });
  for (const c of l.clusters) CL.set(c.id, { ...c, idx: [] });
  P.arguments.forEach((a, i) => { const c = CL.get(a.cluster_ids[M.level]); if (c) c.idx.push(i); });
  for (const t of [...l.top].sort((a, b) => b.size - a.size)) TOPS.push(t);
  PAIRS = l.pairs.map((q) => {
    const A = CL.get(q.a), B = CL.get(q.b);
    return { ...q, A, B, far: q.d >= M.far, cross: A.top !== B.top, ev: q.ev.map((e) => [e[0], e[1].map((id) => ARG.get(id)), e[2].map((id) => ARG.get(id))]) };
  });
  ready = true;
  $("bar").hidden = false; $("ctl").hidden = false;
  $("lang").hidden = !(P.translations && P.translations.en && P.translations.en.clusters);
  readColors();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
  new ResizeObserver(resize).observe($("mapbox"));
  resize();
  // #p=<a>,<b> か #c=<id> で選んだ状態から始める
  const hm = location.hash.match(/^#p=([^,]+),(.+)$/), hc = location.hash.match(/^#c=(.+)$/);
  let start = null;
  if (hm) {
    const a = decodeURIComponent(hm[1]), b = decodeURIComponent(hm[2]);
    const pr = PAIRS.find((x) => (x.a === a && x.b === b) || (x.a === b && x.b === a)); // 順番は問わない
    if (pr) { if (pr.tier > tier) tier = pr.tier; start = { kind: "pair", p: pr }; }
  } else if (hc && CL.get(decodeURIComponent(hc[1]))) start = { kind: "cluster", c: CL.get(decodeURIComponent(hc[1])) };
  if (!start && location.hash) history.replaceState(null, "", location.pathname + location.search); // 見つからない組は URL からも消す
  refresh();
  applyLang();
  if (start) select(start, true);
}
main().catch((e) => {
  $("sub").textContent = I18N[lang].fail + (e && e.message || e);
  $("sub").classList.add("err");
});
</script>
</body>
</html>
