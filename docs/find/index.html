<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自分の声を探す</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #fcfcfb; --fg: #1d1d1b; --muted: #6b6a64; --line: #d8d6ce; --accent: #2f4f7f;
  --dot: rgba(107,106,100,.26); --dot-main: rgba(107,106,100,.50);
  --near: #5598e7; --vnear: #1c5cab; --post: #eb6834; --chip: #ecebe5;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --surface: #1a1a19; --fg: #ecebe6; --muted: #a09f98; --line: #34363a; --accent: #8fb0e0;
    --dot: rgba(160,159,152,.24); --dot-main: rgba(196,195,188,.58);
    --near: #3987e5; --vnear: #9ec5f4; --post: #d95926; --chip: #26272a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181a; --surface: #1a1a19; --fg: #ecebe6; --muted: #a09f98; --line: #34363a; --accent: #8fb0e0;
  --dot: rgba(160,159,152,.24); --dot-main: rgba(196,195,188,.58);
  --near: #3987e5; --vnear: #9ec5f4; --post: #d95926; --chip: #26272a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.55 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header, .bar, main, footer { max-width: 1180px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
header { padding-top: 12px; }
h1 { font-size: 17px; margin: 0 0 2px; }
h1 a { color: inherit; text-decoration: none; }
h2 { font-size: 13px; margin: 0 0 6px; }
.sub { color: var(--muted); font-size: 12px; }
a { color: var(--accent); }
button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer; white-space: nowrap; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, textarea:focus-visible, input:focus-visible, .hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 8px; padding-bottom: 4px; }
.tabs { display: inline-flex; }
.tabs button { border-radius: 0; }
.tabs button:first-child { border-radius: 6px 0 0 6px; }
.tabs button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.spacer { flex: 1; }
.ask { padding: 6px 0 4px; }
.row { display: flex; gap: 8px; align-items: stretch; }
textarea, input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
textarea { resize: vertical; min-height: 2.6em; line-height: 1.45; }
.ex { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
.ex button { font-size: 12px; padding: 2px 9px; border-radius: 12px; background: var(--chip); border-color: transparent; color: var(--fg); white-space: normal; text-align: left; }
.privacy { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.summary { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.summary .head { font-size: 15px; }
.summary .head b { font-weight: 650; }
.summary .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.summary details { margin-top: 6px; font-size: 12px; color: var(--muted); }
.summary details summary { cursor: pointer; color: var(--accent); }
/* 広い画面：左に地図（スクロールしても見えたまま）、右に要約・内訳・一覧。狭い画面：要約 → 地図 → 内訳・一覧の順に縦に */
.layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 12px 16px; align-items: start; margin-top: 10px; }
.mapcol { grid-column: 1; grid-row: 1 / span 2; position: sticky; top: 8px; }
.summary { grid-column: 2; grid-row: 1; }
.side { grid-column: 2; grid-row: 2; }
.mapcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.plot { position: relative; aspect-ratio: 1 / 1; max-height: calc(100vh - 70px); width: 100%; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 280px; box-shadow: 0 2px 8px rgba(0,0,0,.14); display: none; z-index: 2; }
.tip .p, .detail .p { color: var(--muted); font-size: 11px; }
.maptools { padding: 7px 10px; border-bottom: 1px solid var(--line); min-height: 32px; }
.zoom { position: absolute; right: 8px; top: 8px; z-index: 2; font-size: 12px; padding: 3px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend[hidden] { display: none; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.sw.base { background: var(--dot-main); width: 5px; height: 5px; }
.sw.near { background: var(--near); }
.sw.vnear { background: var(--vnear); }
.sw.weak { background: transparent; border: 1px solid var(--muted); }
.sw.post { background: var(--post); width: 11px; height: 11px; }
.sw.pin { width: 12px; height: 12px; background: none; border: 2px solid var(--fg); position: relative; }
/* 地図で選んだ意見：地図の上端に重ねる（選んだ点が上の方なら下端に）。地図は画面に残るので、選んだ意見も見える */
.detail { position: absolute; left: 8px; right: 8px; top: 40px; max-height: 45%; overflow: auto; padding: 8px 30px 8px 10px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.16); z-index: 3; }
.detail.low { top: auto; bottom: 8px; }
.detail .x { position: absolute; right: 4px; top: 4px; border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; padding: 4px 6px; }
.detail[hidden] { display: none; }
.detail .acts { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; }
.detail .acts button { font-size: 12px; padding: 2px 9px; }
.side { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.bd-row { margin: 0 0 7px; }
.bd-row .nm { font-size: 13px; display: flex; gap: 8px; justify-content: space-between; align-items: baseline; }
.bd-row .nm span:first-child { min-width: 0; }
.bd-row .n { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; }
.bd-row .n small { font-weight: 400; color: var(--muted); }
.bd-row .track { height: 8px; margin-top: 3px; }
.bd-row .track i { display: block; height: 100%; background: var(--vnear); border-radius: 0 4px 4px 0; min-width: 2px; }
.bd-row.lo { margin-left: 14px; }
.bd-row.lo .nm { font-size: 12px; color: var(--muted); }
.bd-row.lo .track { height: 6px; }
.bd-row.lo .track i { background: var(--near); }
.bd-more { font-size: 12px; color: var(--muted); }
ol.hits { list-style: none; margin: 0; padding: 0; }
.hit { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 2px 8px; padding: 7px 4px; border-top: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
.hit:first-child { border-top: 0; }
.hit:hover, .hit.on { background: var(--chip); }
.hit .sc { font-variant-numeric: tabular-nums; font-weight: 600; display: flex; gap: 5px; align-items: center; }
.hit .lv { grid-column: 1; font-size: 10px; color: var(--muted); line-height: 1.2; }
.hit .tx { grid-column: 2; grid-row: 1 / span 2; }
.hit .pt { grid-column: 2; font-size: 11px; color: var(--muted); }
.hit .pt a { white-space: nowrap; }
.hit .ja { grid-column: 2; font-size: 11px; color: var(--muted); }
.divider { font-size: 11px; color: var(--muted); padding: 8px 4px 2px; border-top: 1px dashed var(--line); }
mark { background: #f3d36b; color: #1d1d1b; padding: 0 1px; border-radius: 2px; }
.more { width: 100%; margin-top: 6px; font-size: 12px; border-style: dashed; background: transparent; color: var(--accent); }
.empty { color: var(--muted); font-size: 13px; }
.post-arg { padding: 8px 0; border-top: 1px solid var(--line); }
.post-arg:first-of-type { border-top: 0; }
.post-arg .pt { font-size: 11px; color: var(--muted); margin-top: 2px; }
.post-arg .acts { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; }
.post-arg .acts button { font-size: 12px; padding: 2px 9px; }
.attrs { font-size: 11px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 12px; margin: 16px 0 0; }
.note p { margin: 0 0 6px; }
footer { padding-top: 8px; padding-bottom: 24px; color: var(--muted); font-size: 11px; }
footer a { white-space: nowrap; }
[hidden] { display: none !important; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: none; }
  .mapcol, .summary, .side { grid-column: 1; grid-row: auto; }
  .summary { order: 1; } .mapcol { order: 2; position: static; } .side { order: 3; }
  .plot { max-height: none; }
  .ex { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .ex::-webkit-scrollbar { display: none; }
  .ex button, .ex span { flex: none; white-space: nowrap; }
}
</style>
</head>
<body>
<header>
  <h1><a href="../" aria-label="カタログへ戻る">←</a> <span id="title">自分の声を探す</span></h1>
  <div class="sub" id="sub">読み込み中…</div>
</header>
<div class="bar">
  <div class="tabs" role="group" aria-label="探し方">
    <button id="tabText" aria-pressed="true">文で探す</button><button id="tabPost" aria-pressed="false">投稿で引く</button>
  </div>
  <span class="spacer"></span>
  <button id="lang">EN</button>
</div>
<main>
  <section class="ask">
    <form id="fText" class="row" autocomplete="off">
      <textarea id="q" rows="2" aria-label="文" disabled></textarea>
      <button type="submit" id="go" disabled>探す</button>
    </form>
    <form id="fPost" class="row" autocomplete="off" hidden>
      <input type="text" id="post" aria-label="投稿" disabled>
      <button type="submit" id="goPost" disabled>引く</button>
    </form>
    <div class="ex" id="ex"></div>
    <p class="privacy" id="privacy"></p>
  </section>
  <div class="layout">
    <section class="summary" id="summary" aria-live="polite"><div class="meta">読み込み中…</div></section>
    <div class="mapcol">
      <figure class="mapcard" style="margin:0">
        <div class="maptools"><div class="legend" id="legend"></div></div>
        <div class="plot" id="plot"><canvas id="map" role="img"></canvas><button id="zoom" class="zoom" hidden></button><div class="tip" id="tip"></div><div class="detail" id="detail" hidden></div></div>
      </figure>
    </div>
    <div class="side" id="side"></div>
  </div>
  <div class="note" id="note"></div>
</main>
<footer id="foot"></footer>
<script>
"use strict";
// 事前計算はしない。public_result.json を読んでブラウザの中で文字 n-gram の TF-IDF の索引を作り、
// 入れた文と字面の近い意見を cosine で探す。入れた文はどこにも送らない。
// 近さの目安（LEVELS）と、文字 n-gram の選び方の根拠は README の「自分の声を探すの作り」
// （scripts/build_find_check.py で同じ計算を Python でやり直して確かめた）。
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const DATA = params.get("data") || "../data/team-mirai-2025/public_result.json";
let GROUP = params.get("group") || "comment_id";   // 「同じ投稿」とみなして束ねる属性。トップレベルの項目か attributes の名前
const LEVELS = { ja: [0.20, 0.30, 0.45], en: [0.30, 0.40, 0.55] };  // 少し重なる・近い・とても近い
const MARK_K = 20;   // 地図の印（おおよその位置）に使う近い意見の数
const PAGE = 30;
const SRC = "https://github.com/nishio/broadlistening-visualizations/blob/main/docs/find/index.html";
const NARROW = matchMedia("(max-width: 820px)");   // CSS の 1 段組と同じ境目
const DATASET = "https://huggingface.co/datasets/nishiohirokazu/team-mirai-2025-embeddings";
const EXAMPLES = [
  ["夫婦別姓を早く導入してほしい", "I want selective separate surnames for married couples introduced soon"],
  ["原発の再稼働に反対です", "I oppose restarting nuclear power plants"],
  ["保育士の給料を上げてほしい", "Please raise the salaries of nursery teachers"],
  ["マイナンバーカードが使いにくい", "The My Number Card is hard to use"],
  ["AI で行政を効率化してほしい", "Use AI to make government more efficient"],
];

const I18N = {
  ja: {
    title: "自分の声を探す", tabText: "文で探す", tabPost: "投稿で引く", go: "探す", goPost: "引く", ex: "例：",
    sub: (n) => `意見 ${n.toLocaleString()} 件の中から、自分が書いたこと・言いたいことと字面の近い意見を探し、どのまとまりにどれだけあるかを地図と一覧で出す。投稿の URL や番号からも引ける。`,
    ph: "自分が書いたこと・言いたいことを入れる",
    phPost: (g, ex) => `投稿の URL か ${g} の値（例：${ex}）`,
    privacy: "入れた文はこのページの中だけで比べ、どこにも送らない（索引もブラウザの中で作る）。",
    building: "索引を作成中…",
    idle: "文を入れると、字面の近い意見を探して地図で光らせる。",
    idlePost: "投稿の URL か番号を入れると、その投稿の意見を地図で光らせる。",
    tooShort: "もう少し長く入れてほしい（2 文字以上）。",
    lv: ["少し重なる", "近い", "とても近い"],
    head: (n, t) => `似た声は <b>${n.toLocaleString()} 件</b>（近さ ${t.toFixed(2)} 以上）`,
    headNone: (t, best) => `近さ ${t.toFixed(2)} 以上の意見は見つからなかった` + (best != null ? `（いちばん近いもので ${best.toFixed(2)}）` : ""),
    groups: (n, g) => `${g}で数えると ${n.toLocaleString()} 件`,
    very: (n, t) => `うち「とても近い」（${t.toFixed(2)} 以上）は ${n.toLocaleString()} 件`,
    main: (l, n, ll, ln) => `主に「${l}」のまとまり（${n.toLocaleString()} 件）` + (ll ? `、中でも「${ll}」（${ln.toLocaleString()} 件）` : ""),
    most: (l, n, ll, ln) => `最も多いのは「${l}」のまとまり（${n.toLocaleString()} 件）` + (ll ? `、中でも「${ll}」（${ln.toLocaleString()} 件）` : ""),
    split: (k, n) => `${k} つのまとまりに分かれる（最も多いまとまりでも ${n.toLocaleString()} 件）`,
    noneHint: "字面が違うと拾えないので、言い方や言葉を変えて試してほしい（例：「給料」→「給与」）。",
    take: "このまとまりの説明",
    excluded: (n) => `この投稿の意見 ${n} 件は除いた`,
    stats: (n, ms) => `意見 ${n.toLocaleString()} 件から ${ms < 1 ? "1 ms 未満で" : Math.round(ms) + " ms で"}探した`,
    bd: "どのまとまりに入っているか", bdNote: (n) => `近い意見 ${n.toLocaleString()} 件の内訳（棒の長さは近い意見に占める割合・右は件数／まとまり全体の件数）`,
    bdNone: "近い意見がないので、内訳は出さない。",
    bdMore: (k, n) => `ほか ${k} つのまとまりに ${n.toLocaleString()} 件`,
    loMore: (k, n) => `ほか ${k} つの小さなまとまりに ${n.toLocaleString()} 件`,
    list: "近い意見", listRef: "近い意見（どれも近さが低いので参考）",
    below: (t) => `ここから下は近さ ${t.toFixed(2)} 未満（少し重なるだけ）`,
    more: (n) => `もっと見る（残り ${n.toLocaleString()} 件）`,
    src: "出典", srcOpen: "元の投稿を開く", searchThis: "この意見で似た声を探す",
    legBase: (n) => `意見（全 ${n.toLocaleString()} 件）`, legNear: (a, b) => `近い（${a.toFixed(2)}〜）`, legVnear: (b) => `とても近い（${b.toFixed(2)}〜）`,
    legPin: "入れた文のおおよその位置", legPost: "この投稿の意見",
    zoomIn: "近い意見のあたりに寄る", zoomInPost: "この投稿の意見のあたりに寄る", zoomOut: "全体を見る",
    mapAlt: (n) => `広聴AI の 2 次元配置に意見 ${n.toLocaleString()} 件を点で描いた地図`,
    postHead: (k) => `この投稿から取り出された意見は <b>${k} 件</b>。地図ではオレンジの点。`, postKey: "投稿：",
    postNone: (s, exU, g, exV) => `「${s}」に当たる投稿は見つからなかった。投稿の URL（例：${exU}）か ${g} の値（例：${exV}）を入れてほしい。`,
    postArgs: "この投稿の意見", postSim: (n, t) => `似た声 ${n.toLocaleString()} 件（近さ ${t.toFixed(2)} 以上・この投稿を除く）`,
    path: (a, b) => `${a} › ${b}`,
    note: [
      "字面（文字の並び）の近さで探している。言い換え（「給料」と「給与」など）は拾えない。意味の近さで探すには、入れた文を意見と同じモデルで埋め込み（ベクトル）にする API が要り、ブラウザだけではできない（文をその API に送ることになる）。",
      "「似た声」の件数は意見の数で、人数ではない（1 つの投稿から複数の意見が取り出され、1 人が何度も投稿することもある）。",
      "近さは 0〜1 の cosine。日本語は 2 文字の組と、ひらがな以外の 1 文字の TF-IDF で比べる。目安は 0.45 以上が「とても近い」、0.30 以上が「近い」、0.20 以上が「少し重なる」（目安はチームみらい 2025 のデータで決めた。近さ 0.30〜0.35 の 2 件は半分が同じ上位のまとまりに、0.45〜0.50 の 2 件は半分が同じ下位のまとまりに入っていた）。文末の「〜してほしい」「です」「ます」などは外して比べる（意見の文はほぼ「〜である」の形で書かれているため）。",
      "地図は広聴AI の 2 次元配置（arguments の x / y）。印は、近い意見（近い順に 20 件まで）の位置を近さで重み付けした幾何中央値で、離れた所にある少数の近い意見には引っぱられにくい。",
    ],
    foot: "出典：チームみらい・しゃべれるマニフェスト参加者 / データセット ", code: "ソースコード",
    idx: (n, v, ms) => `索引：意見 ${n.toLocaleString()} 件・文字の組 ${v.toLocaleString()} 種・作成 ${Math.round(ms)} ms`,
    failed: "読み込みに失敗しました: ",
    groupName: (g) => g === "comment_id" ? "コメント" : g + " ",
    noGroup: (g) => `（?group=${g} の属性が意見に無いので comment_id で束ねた）`,
  },
  en: {
    title: "Find your voice", tabText: "Search by text", tabPost: "Look up a post", go: "Search", goPost: "Look up", ex: "e.g.",
    sub: (n) => `Search ${n.toLocaleString()} opinions for the ones whose wording is close to what you wrote or want to say, and see on the map and in the list which groups they fall into. You can also look up a post by its URL or number.`,
    ph: "Type what you wrote or want to say",
    phPost: (g, ex) => `URL of the post, or its ${g} (e.g. ${ex})`,
    privacy: "What you type is compared inside this page only and is never sent anywhere (the index is built in your browser).",
    building: "Building the index…",
    idle: "Type a sentence to find opinions with similar wording and highlight them on the map.",
    idlePost: "Enter the URL or number of a post to highlight its opinions on the map.",
    tooShort: "Please type a little more.",
    lv: ["some overlap", "close", "very close"],
    head: (n, t) => `<b>${n.toLocaleString()}</b> similar voices (similarity ${t.toFixed(2)} or more)`,
    headNone: (t, best) => `No opinion reaches similarity ${t.toFixed(2)}` + (best != null ? ` (the closest is ${best.toFixed(2)})` : ""),
    groups: (n, g) => `${n.toLocaleString()} distinct ${g}`,

  "can could should would will may might must shall do does did have has had more most very also into about over under between among " +
  "within without through during before after above below up down out off again further once if because while until against " +
  "all any both each few other some own same only too just please want wants wish hope think feel").split(" "));

    // 1 文字だけの一致に印を付けるのは漢字のときだけ（「ー」やカタカナ・英字 1 字の一致はどの文にもあり、印がちらばるだけ）

  const a = el("a", null, "nishiohirokazu/team-mirai-2025-embeddings"); a.href = DATASET; f.appendChild(a);
  f.appendChild(document.createTextNode(" (CC BY 4.0) · "));
  const b = el("a", null, T.code); b.href = SRC; f.appendChild(b);
  renderExamples();
}
function switchLang() {
  const old = lang; lang = lang === "ja" ? "en" : "ja";
  status(t().building);
  // 例文や、意見から探していたときは、もう一方の言語の文に差し替える
  const q = $("q").value.trim(), pair = EX.find((p) => p[old === "en" ? 1 : 0] === q);
  if (pair) $("q").value = pair[lang === "en" ? 1 : 0];
  // 「索引を作成中…」を一度描いてから、重い処理（初めて英語にしたときの索引づくり）をする
  requestAnimationFrame(() => setTimeout(() => {
    applyLang();
    if (excludeFor) { $("q").value = aText(excludeFor.arg); excludeFor.text = $("q").value.trim(); }
    if (mode === "text") { lastQ = ""; R = null; submitText(); }
    else { draw(); renderPost(); }
  }, 0));
}
let GROUP_NOTE = null;
let EX = [];   // 出す例文（[日本語, 英語] の組）
// 例文は、このレポートで「近い」意見が見つかるものだけを出す。3 つに満たなければ（?data= で別のレポートを読んだとき）、
// 下位のまとまりの表札で 5 つまで補う。大きい上位のまとまりから順に、その中で大きい下位のまとまりを 1 つずつ回して取る
function pickExamples(byUp) {
  const ex = EXAMPLES.filter(([q]) => search(IX.ja, q, LEVELS.ja[1]).ids.length > 0);
  if (ex.length >= 3) return ex;
  const enC = en().clusters || {};
  const los = byUp.map(([, idx]) => {   // byUp は大きい順
    const n = new Map(); for (const i of idx) n.set(LO[i], (n.get(LO[i]) || 0) + 1);
    return [...n.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => id);
  });
  for (let r = 0; ex.length < 5 && los.some((l) => l.length > r); r++) {
    for (const l of los) {
      const c = C.get(l[r]);
      if (ex.length < 5 && c && c.label && !ex.some((p) => p[0] === c.label) && search(IX.ja, c.label, LEVELS.ja[1]).ids.length > 0) ex.push([c.label, (enC[c.id] && enC[c.id].label) || c.label]);
    }
  }
  return ex;
}

async function main() {
  colors();
  window.findStats = {};
  const t0 = performance.now();
  const res = await fetch(DATA);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}（${DATA}）`);
  P = await res.json();
  window.findStats.loadMs = performance.now() - t0;
  A = P.arguments || [];
  for (const c of P.clusters || []) C.set(c.id, c);
  maxLevel = Math.max(1, ...((P.clusters || []).map((c) => c.level)));
  if (GROUP !== "comment_id" && !A.some((a) => groupOf(a) != null)) { GROUP_NOTE = GROUP; GROUP = "comment_id"; }
  X = new Float64Array(A.length); Y = new Float64Array(A.length);
  A.forEach((a, i) => {
    X[i] = a.x; Y[i] = a.y;
    UP[i] = a.cluster_ids[1] || a.cluster_ids[0]; LO[i] = a.cluster_ids[Math.min(maxLevel, a.cluster_ids.length - 1)];
    if (a.url) { const u = normUrl(a.url); if (!URLS.has(u)) URLS.set(u, []); URLS.get(u).push(i); }
    const g = groupOf(a); if (g != null) { if (!GROUPS.has(g)) GROUPS.set(g, []); GROUPS.get(g).push(i); }
  });
  bounds = { x0: Infinity, x1: -Infinity, y0: Infinity, y1: -Infinity };
  for (let i = 0; i < A.length; i++) { bounds.x0 = Math.min(bounds.x0, X[i]); bounds.x1 = Math.max(bounds.x1, X[i]); bounds.y0 = Math.min(bounds.y0, Y[i]); bounds.y1 = Math.max(bounds.y1, Y[i]); }
  // 上位のまとまりの表札を置く位置：x と y それぞれの中央値
  const byUp = new Map();
  A.forEach((a, i) => { if (!byUp.has(UP[i])) byUp.set(UP[i], []); byUp.get(UP[i]).push(i); });
  const med = (arr) => { const s = arr.slice().sort((p, q) => p - q); return s[Math.floor(s.length / 2)]; };
  const upSorted = [...byUp.entries()].filter(([id]) => C.has(id) && C.get(id).level > 0).sort((p, q) => q[1].length - p[1].length);
  upSorted.forEach(([id, idx]) => upCenter.set(id, [med(idx.map((i) => X[i])), med(idx.map((i) => Y[i]))]));
  if (!(P.translations && P.translations.en)) $("lang").style.display = "none";
  status(I18N.ja.building);
  await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
  IX.ja = buildIndex(A.map((a) => a.argument), gramsJa, "ja");
  EX = pickExamples(upSorted);
  window.findStats.indexJaMs = IX.ja.ms; window.findStats.vocabJa = IX.ja.V; window.findStats.postingsJa = IX.ja.nnz;
  ["q", "go", "post", "goPost"].forEach((id) => { $(id).disabled = false; });
  // 文は入れている途中（日本語の変換中を除く）も、少し止まったら探す
  let timer = null, composing = false;
  $("q").addEventListener("compositionstart", () => { composing = true; clearTimeout(timer); });  // 変換の前に仕掛かった検索も、変換中は走らせない
  $("q").addEventListener("compositionend", () => { composing = false; clearTimeout(timer); timer = setTimeout(submitText, 250); });
  $("q").addEventListener("input", () => { if (composing) return; clearTimeout(timer); timer = setTimeout(submitText, 250); });
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); clearTimeout(timer); submitText(); } });
  $("fText").addEventListener("submit", (e) => { e.preventDefault(); clearTimeout(timer); submitText(); });
  $("fPost").addEventListener("submit", (e) => { e.preventDefault(); lookup($("post").value); });
  $("tabText").addEventListener("click", () => setMode("text"));
  $("tabPost").addEventListener("click", () => setMode("post"));
  $("lang").addEventListener("click", switchLang);
  new ResizeObserver(resize).observe($("plot"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { colors(); draw(); });
  applyLang();
  resize();
  // #q=文 / #post=URL か値 で、開いたときに探す（ハッシュはサーバーに送られない）
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("post")) { setMode("post"); $("post").value = h.get("post"); lookup(h.get("post")); }
  else { setMode("text"); if (h.get("q")) { $("q").value = h.get("q"); submitText(); } }
  if (matchMedia("(pointer: fine)").matches) $(mode === "post" ? "post" : "q").focus({ preventScroll: true });  // スマホでは開いた途端にキーボードを出さない
}
main().catch((e) => { status(I18N[lang].failed + ((e && e.message) || e)); console.error(e); });
</script>
